<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Kind Classifier</title>
<style>
  :root { --bg:#f6f3ee; --card:#fff; --ink:#2b2622; --muted:#7a716a; --accent:#c8642c; --bar:#f0e2d6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .drop { display:block; border:2px dashed #d9cfc6; border-radius:12px; padding:24px; text-align:center; cursor:pointer; color:var(--muted); }
  .drop:hover { border-color:var(--accent); }
  #preview { display:none; max-width:100%; max-height:320px; margin:0 auto 4px; border-radius:10px; }
  input[type=file] { display:none; }
  button { margin-top:16px; width:100%; padding:12px; font-size:16px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #result { margin-top:20px; }
  .verdict { font-size:20px; font-weight:600; margin-bottom:12px; }
  .row { margin:8px 0; }
  .row .label { display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px; }
  .track { height:10px; background:var(--bar); border-radius:6px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); }
  .note { font-size:13px; color:var(--muted); margin-top:12px; }
  .error { color:#b3261e; }
</style>
</head>
<body>
<main>
  <h1>🐱 Cat Kind Classifier</h1>
  <p class="sub">Upload a photo of a cat and find out which kind it is (ResNet50 running in a Cog container).</p>
  <div class="card">
    <label class="drop" for="file">
      <img id="preview" alt="Selected image">
      <span id="hint">Click to choose a cat photo</span>
    </label>
    <input id="file" type="file" accept="image/*">
    <button id="classify" disabled>Classify</button>
    <div id="result"></div>
  </div>
</main>
<script>
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const hint = document.getElementById("hint");
const button = document.getElementById("classify");
const result = document.getElementById("result");

const pretty = { "striped tabby": "Tabby (striped)", "Persian cat": "Persian",
                 "Siamese cat": "Siamese", "Egyptian cat": "Egyptian Mau" };
const pct = p => (p * 100).toFixed(1) + "%";

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  result.innerHTML = "";
  if (!file) { button.disabled = true; return; }
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  hint.textContent = file.name;
  button.disabled = false;
});

button.addEventListener("click", async () => {
  const form = new FormData();
  form.append("image", fileInput.files[0]);
  button.disabled = true;
  button.textContent = "Classifying…";
  result.innerHTML = "";
  try {
    const res = await fetch("/api/classify", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    render(data);
  } catch (err) {
    result.innerHTML = `<p class="error">${err.message}</p>`;
  } finally {
    button.disabled = false;
    button.textContent = "Classify";
  }
});

function render(data) {
  const top3 = Object.entries(data.top3_imagenet).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} (${pct(v)})`).join(", ");
  if (!data.is_cat) {
    result.innerHTML = `<div class="verdict">This doesn't look like a cat 🤔</div>
      <p class="note">The model sees: ${top3}</p>`;
    return;
  }
  // ImageNet splits striped tabbies into two labels ("tabby" and "tiger cat"), so show them as one kind
  const breeds = { ...data.breeds };
  breeds["striped tabby"] = (breeds["tabby"] || 0) + (breeds["tiger cat"] || 0);
  delete breeds["tabby"];
  delete breeds["tiger cat"];
  const best = Object.entries(breeds).sort((a, b) => b[1] - a[1])[0][0];
  const rows = Object.entries(breeds).sort((a, b) => b[1] - a[1]).map(([name, p]) => `
    <div class="row">
      <div class="label"><span>${pretty[name] || name}</span><span>${pct(p)}</span></div>
      <div class="track"><div class="fill" style="width:${p * 100}%"></div></div>
    </div>`).join("");
  const kind = pretty[best] || best;
  const article = /^[AEIOU]/i.test(kind) ? "an" : "a";
  result.innerHTML = `<div class="verdict">Looks like ${article} ${kind} cat</div>
    ${rows}
    <p class="note">Cat confidence: ${pct(data.cat_confidence)} · Raw top-3: ${top3}<br>"Tabby (striped)" combines the ImageNet labels "tabby" and "tiger cat", which both describe striped tabby cats.</p>`;
}
</script>
</body>
</html>
